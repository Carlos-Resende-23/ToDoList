<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>ToDo List</h1>
      <p id="contador"></p>
      <div class="filtros">
        <button id="filtro-todas">Todas</button>
        <button id="filtro-pendentes">Pendentes</button>
        <button id="filtro-concluidas">Concluídas</button>
      </div>
      <div class="input-container">
        <input type="text" id="buscar" placeholder="Buscar tarefa" />
        <input id="task-input" type="text" placeholder="Adicionar uma tarefa" />
        <button id="add-button">Adicionar</button>
      </div>
      <button id="clear-done">Limpar concluidas</button>
      <ul class="list" id="task-list"></ul>
    </div>

    <footer class="footer">
      <p>&copy Carlos Resende - 2026 Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
